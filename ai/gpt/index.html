<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Chatbot ChatGPT</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 400px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    .chat-header {
      background: #10a37f;
      color: white;
      padding: 10px;
      text-align: center;
      border-radius: 10px 10px 0 0;
    }

    .chat-box {
      padding: 10px;
      height: 300px;
      overflow-y: auto;
      border-bottom: 1px solid #ddd;
    }

    .user {
      text-align: right;
      margin: 5px 0;
      color: #333;
    }

    .bot {
      text-align: left;
      margin: 5px 0;
      color: #10a37f;
    }

    .chat-input {
      display: flex;
    }

    .chat-input input {
      flex: 1;
      padding: 10px;
      border: none;
      outline: none;
    }

    .chat-input button {
      padding: 10px;
      border: none;
      background: #10a37f;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    🤖 Chatbot ChatGPT
  </div>

  <div class="chat-box" id="chatBox"></div>

  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Ketik pesan..." />
    <button onclick="sendMessage()">Kirim</button>
  </div>
</div>

<script>
  const API_KEY = ""; // ⚠️ Jangan untuk produksi

  const chatBox = document.getElementById("chatBox");
  const userInput = document.getElementById("userInput");

  async function sendMessage() {
    const message = userInput.value;
    if (!message) return;

    chatBox.innerHTML += `<div class="user"><b>Kamu:</b> ${message}</div>`;
    userInput.value = "";

    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
      },
      body: JSON.stringify({
        model: "gpt-4o-mini",
        messages: [
          { role: "system", content: "Kamu adalah chatbot yang ramah dan membantu." },
          { role: "user", content: message }
        ]
      })
    });

    const data = await response.json();
    const reply = data.choices[0].message.content;

    chatBox.innerHTML += `<div class="bot"><b>Bot:</b> ${reply}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
  }
</script>

</body>
</html>
