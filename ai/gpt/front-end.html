<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Modern AI Chatbot</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Prism.js -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-html.min.js"></script>

<style>
:root{
  --primary:#10a37f;
  --bg:#f7f7f8;
  --user:#dcf8c6;
  --bot:#ffffff;
}

/* General layout */
body{margin:0;font-family:Arial;height:100vh;display:flex;justify-content:center;align-items:center;background:var(--bg);}
.chat-app{width:100%;max-width:500px;height:92vh;background:#fff;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.12);}
.header{background:var(--primary);color:#fff;padding:14px;display:flex;justify-content:space-between;align-items:center;font-weight:bold;}
.header button{background:none;border:none;color:white;cursor:pointer;margin-left:8px;}
.chat{flex:1;padding:14px;overflow-y:auto;}
.msg{max-width:95%;padding:12px 14px;margin-bottom:12px;border-radius:12px;white-space:pre-wrap;line-height:1.5;font-size:14px;}
.user{background:var(--user);margin-left:auto;border-bottom-right-radius:4px;}
.bot{background:var(--bot);border:1px solid #ddd;margin-right:auto;border-bottom-left-radius:4px;}
.typing{font-size:13px;color:gray;margin-bottom:8px;}
.input-area{border-top:1px solid #ddd;padding:10px;display:flex;gap:8px;}
textarea{flex:1;resize:none;height:52px;padding:12px;border-radius:10px;border:1px solid #ccc;outline:none;font-size:14px;}
button.send{background:var(--primary);border:none;color:white;padding:0 16px;border-radius:8px;cursor:pointer;}
/* Code block */
.code-container{border-radius:10px;overflow:hidden;margin-top:10px;font-size:13px;border:1px solid #ddd;}
.code-header{display:flex;justify-content:space-between;align-items:center;background:#f0f0f0;padding:4px 8px;font-weight:bold;}
.code-header span{font-size:12px;}
.code-header button{background:#e5e5e5;color:#111;border:none;font-size:12px;padding:2px 6px;margin-left:4px;border-radius:4px;cursor:pointer;}
.code-header button:hover{background:#10a37f;color:#fff;}
pre{margin:0;padding:12px;overflow-x:auto;}
.dark-mode pre{background:#1e1e1e;color:#f5f5f5;}
/* Modal preview */
.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,0.7);justify-content:center;align-items:center;}
.modal-content{background:#fff;padding:10px;border-radius:10px;width:80%;height:80%;position:relative;}
.modal-content iframe{width:100%;height:100%;border:none;}
.modal-close{position:absolute;top:6px;right:10px;background:red;color:#fff;border:none;border-radius:6px;padding:2px 6px;cursor:pointer;}
</style>
</head>
<body>

<div class="chat-app">
  <div class="header">
    🤖 AI Chatbot
    <button onclick="clearChat()">Clear</button>
  </div>

  <div class="chat" id="chat"></div>

  <div class="input-area">
    <textarea id="input" placeholder="Ketik pesan... (Enter = kirim, Shift+Enter = baris baru)"></textarea>
    <button class="send" onclick="sendMessage()">Kirim</button>
  </div>
</div>

<!-- Modal Preview -->
<div class="modal" id="modal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">X</button>
    <iframe id="preview-iframe"></iframe>
  </div>
</div>

<script src="chat.js"></script>
</body>
</html>
