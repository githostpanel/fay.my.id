<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot Penjelasan AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
body {
    font-family: 'Inter', sans-serif;
    background-color: #f7f7f7;
}
#chat-output {
    scrollbar-width: thin;
    scrollbar-color: #cbd5e1 #f1f1f1;
}
#chat-output::-webkit-scrollbar {
    width: 8px;
}
#chat-output::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 10px;
}
#chat-output::-webkit-scrollbar-thumb {
    background-color: #cbd5e1;
    border-radius: 10px;
}
.settings-open {
    max-height: 150px !important;
}
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 bg-gray-100">

<div class="w-full max-w-lg bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col h-[90vh] max-h-[800px]">

    <!-- Header -->
    <header class="bg-indigo-600 p-4 shadow-lg flex items-center rounded-t-xl">
        <div class="h-8 w-8 bg-white rounded-full flex items-center justify-center mr-3">
            <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                d="M9 3v2m6-2v2M9 19v2m6-2v2M5 10v2m14-2v2M3 10h2m16 0h2M7 9l1.5-1.5M15.5 16.5L17 15M7 15l1.5 1.5M15.5 7.5L17 9m-11 5a4 4 0 118 0 4 4 0 01-8 0z"></path>
            </svg>
        </div>
        <h1 class="text-xl font-bold text-white">Gemini Penjelas AI</h1>
    </header>

    <!-- Chat output -->
    <div id="chat-output" class="flex-grow p-4 space-y-4 overflow-y-auto"></div>

    <!-- Input & Settings -->
    <div class="p-4 bg-gray-50 border-t">
        <form id="chat-form" class="flex space-x-2">
            <input type="text" id="user-input" placeholder="Tanyakan tentang AI..." required
                   class="flex-grow p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
            <button type="submit" id="send-button"
                    class="bg-indigo-600 text-white p-3 rounded-lg hover:bg-indigo-700 transition duration-150 active:scale-95 disabled:bg-indigo-400 disabled:cursor-not-allowed flex items-center justify-center w-12 h-12">
                <svg id="send-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                    d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
                <div id="loading-spinner" class="hidden animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
            </button>
        </form>

        <button id="toggle-settings" class="w-full text-sm text-indigo-600 hover:text-indigo-800 transition duration-150 mt-3 flex items-center justify-center">
            <span>Pengaturan Lanjutan</span>
            <svg id="settings-icon" class="w-4 h-4 ml-1 transform transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
        </button>

        <div id="advanced-settings" class="grid grid-cols-2 gap-3 mt-4 max-h-0 overflow-hidden transition-all duration-500">
            <div>
                <label class="block text-xs font-medium text-gray-700">Mode</label>
                <select id="setting-mode" class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="simple">Simple</option>
                    <option value="analogy">Analogy</option>
                    <option value="steps">Steps</option>
                    <option value="funny">Funny</option>
                    <option value="story">Story</option>
                    <option value="complex">Complex</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700">Kesulitan (1-5)</label>
                <input type="number" id="setting-difficulty" value="2" min="1" max="5" class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700">Panjang (1-5)</label>
                <input type="number" id="setting-length" value="3" min="1" max="5" class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-700">Bahasa</label>
                <select id="setting-language" class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500">
                    <option value="auto">Auto</option>
                    <option value="id">Indonesia</option>
                    <option value="en">English</option>
                    <option value="ko">Korean</option>
                    <option value="jp">Japanese</option>
                </select>
            </div>
        </div>
    </div>
</div>

<script>
const API_ENDPOINT = "https://edoyuwjhdztxlktqmhsl.supabase.co/functions/v1/explain";
const AUTH_TOKEN = "PASTE_API_KEY_ANON_KAMU_DI_SINI";

const chatOutput = document.getElementById("chat-output");
const chatForm = document.getElementById("chat-form");
const userInput = document.getElementById("user-input");
const sendButton = document.getElementById("send-button");
const sendIcon = document.getElementById("send-icon");
const loadingSpinner = document.getElementById("loading-spinner");

const advancedSettings = document.getElementById("advanced-settings");
const toggleSettings = document.getElementById("toggle-settings");
const settingsIcon = document.getElementById("settings-icon");
const settingMode = document.getElementById("setting-mode");
const settingDifficulty = document.getElementById("setting-difficulty");
const settingLength = document.getElementById("setting-length");
const settingLanguage = document.getElementById("setting-language");

toggleSettings.addEventListener("click", () => {
    advancedSettings.classList.toggle("max-h-0");
    advancedSettings.classList.toggle("settings-open");
    settingsIcon.classList.toggle("rotate-180");
});

// Fungsi tambah pesan
function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = `p-3 rounded-xl max-w-xs sm:max-w-md shadow-md ${sender==="user"?"bg-indigo-500 text-white self-end rounded-bl-xl":"bg-gray-200 text-gray-800 self-start rounded-tr-xl"}`;
    div.innerHTML = `<p class="whitespace-pre-wrap">${text}</p>`;
    chatOutput.appendChild(div);
    chatOutput.scrollTop = chatOutput.scrollHeight;
}

// Fungsi tambah suggestion
function addSuggestions(list) {
    if (!list || !list.length) return;
    const wrapper = document.createElement("div");
    wrapper.className = "flex flex-wrap gap-2 justify-start mt-2 mb-2";
    list.forEach(s => {
        const btn = document.createElement("button");
        btn.className = "bg-indigo-100 text-indigo-700 text-sm py-1 px-3 rounded-full hover:bg-indigo-200 transition duration-150 active:scale-95";
        btn.textContent = s;
        btn.onclick = () => sendUserMessage(s); // langsung kirim chat saat klik
        wrapper.appendChild(btn);
    });
    chatOutput.appendChild(wrapper);
    chatOutput.scrollTop = chatOutput.scrollHeight;
}

// Fungsi loading
let loadingEl = null;
function showLoading() {
    loadingEl = document.createElement("div");
    loadingEl.className = "p-3 rounded-xl bg-gray-200 text-gray-800 shadow-md";
    loadingEl.innerText = "🤖 Sedang berpikir...";
    chatOutput.appendChild(loadingEl);
    chatOutput.scrollTop = chatOutput.scrollHeight;
}
function removeLoading() { if(loadingEl){loadingEl.remove(); loadingEl=null;} }

// Fungsi utama kirim pesan
async function sendUserMessage(textFromButton=null){
    const text = textFromButton || userInput.value.trim();
    if(!text) return;
    addMessage(text,"user");
    userInput.value="";
    setLoading(true);
    showLoading();

    const payload = {
        prompt: text,
        mode: settingMode.value,
        difficulty: parseInt(settingDifficulty.value),
        length: parseInt(settingLength.value),
        language: settingLanguage.value
    };

    try {
        const res = await fetch(API_ENDPOINT,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization": `Bearer ${AUTH_TOKEN}`
            },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        removeLoading();
        setLoading(false);

        if(!res.ok || !data.success){
            addMessage(data.msg || "Terjadi kesalahan API","bot");
            return;
        }

        addMessage(data.reply,"bot");
        addSuggestions(data.suggestions);

    } catch(e){
        removeLoading();
        setLoading(false);
        addMessage("❌ Tidak bisa terhubung ke server","bot");
    }
}

function setLoading(flag){
    userInput.disabled=flag;
    sendButton.disabled=flag;
    if(flag){
        sendIcon.classList.add("hidden");
        loadingSpinner.classList.remove("hidden");
    } else {
        sendIcon.classList.remove("hidden");
        loadingSpinner.classList.add("hidden");
    }
}

// Form submit
chatForm.addEventListener("submit", e=>{
    e.preventDefault();
    sendUserMessage();
});

// Inisialisasi chat
addMessage("Halo! Saya siap membantu menjelaskan topik AI. Silakan ketik pertanyaan Anda!","bot");
addSuggestions(["Apa itu AI?","Bagaimana cara kerja AI?","Jelaskan machine learning"]);
</script>

</body>
</html>
