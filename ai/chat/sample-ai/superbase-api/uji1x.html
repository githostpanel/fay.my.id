<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Penjelasan AI</title>
    <!-- Memuat Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Menggunakan font Inter */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f7;
        }
        /* Custom scrollbar untuk kotak chat */
        #chat-output {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f1f1f1;
        }
        #chat-output::-webkit-scrollbar {
            width: 8px;
        }
        #chat-output::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        #chat-output::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
        /* Class untuk mengontrol tinggi saat dibuka/ditutup */
        .settings-open {
            max-height: 150px !important; /* Cukup tinggi untuk menampung 4 input */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 bg-gray-100">

    <div class="w-full max-w-lg bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col h-[90vh] max-h-[800px]">
        
        <!-- Header Chatbot -->
        <header class="bg-indigo-600 p-4 shadow-lg flex items-center rounded-t-xl">
            <div class="h-8 w-8 bg-white rounded-full flex items-center justify-center mr-3">
                <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 10v2m14-2v2M3 10h2m16 0h2M7 9l1.5-1.5M15.5 16.5L17 15M7 15l1.5 1.5M15.5 7.5L17 9m-11 5a4 4 0 118 0 4 4 0 01-8 0z"></path></svg>
            </div>
            <h1 class="text-xl font-bold text-white">Gemini Penjelas AI</h1>
        </header>

        <!-- Output Chat -->
        <div id="chat-output" class="flex-grow p-4 space-y-4 overflow-y-auto">
            <!-- Pesan chat, termasuk saran, akan dimuat di sini -->
        </div>

        <!-- Area Input dan Suggestions -->
        <div class="p-4 bg-gray-50 border-t">
            
            <!-- Form Input -->
            <form id="chat-form" class="flex space-x-2">
                <input type="text" id="user-input" placeholder="Tanyakan tentang AI..." required
                       class="flex-grow p-3 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500 transition duration-150">
                <button type="submit" id="send-button"
                        class="bg-indigo-600 text-white p-3 rounded-lg hover:bg-indigo-700 transition duration-150 active:scale-95 disabled:bg-indigo-400 disabled:cursor-not-allowed flex items-center justify-center w-12 h-12">
                    <svg id="send-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    <div id="loading-spinner" class="hidden animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
                </button>
            </form>

            <!-- Advanced Settings Toggle (Di bawah input) -->
            <button id="toggle-settings" class="w-full text-sm text-indigo-600 hover:text-indigo-800 transition duration-150 mt-3 flex items-center justify-center">
                <span id="settings-label">Pengaturan Lanjutan</span>
                <svg id="settings-icon" class="w-4 h-4 ml-1 transform transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </button>

            <!-- Advanced Settings Form (Tersembunyi secara default) -->
            <div id="advanced-settings" class="grid grid-cols-2 gap-3 mt-4 max-h-0 overflow-hidden transition-all duration-500">
                
                <!-- Mode -->
                <div>
                    <label for="setting-mode" class="block text-xs font-medium text-gray-700">Mode</label>
                    <select id="setting-mode" class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="simple">Sederhana</option>
                        <option value="detailed">Rinci</option>
                        <option value="technical">Teknis</option>
                    </select>
                </div>

                <!-- Difficulty -->
                <div>
                    <label for="setting-difficulty" class="block text-xs font-medium text-gray-700">Kesulitan (1-5)</label>
                    <input type="number" id="setting-difficulty" value="2" min="1" max="5" class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500">
                </div>

                <!-- Length -->
                <div>
                    <label for="setting-length" class="block text-xs font-medium text-gray-700">Panjang (1-5)</label>
                    <input type="number" id="setting-length" value="3" min="1" max="5" class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                
                <!-- Language -->
                <div>
                    <label for="setting-language" class="block text-xs font-medium text-gray-700">Bahasa</label>
                    <select id="setting-language" class="w-full p-2 border border-gray-300 rounded-lg text-sm focus:ring-indigo-500 focus:border-indigo-500">
                          <option value="auto">Auto</option>
						<option value="id">Indonesia</option>
                        <option value="en">English</option>
                        <option value="ko">Korean</option>
                        <option value="jp">Japanese</option>
                    </select>
                </div>
            </div>

            <p class="text-xs text-center text-gray-500 mt-3">API: https://edoyuwjhdztxlktqmhsl.supabase.co/functions/v1/explain</p>
        </div>
    </div>

    <script>
        const API_ENDPOINT = 'https://edoyuwjhdztxlktqmhsl.supabase.co/functions/v1/explain';
        // GANTI 'YOUR_TOKEN' dengan token otorisasi yang valid jika Anda memilikinya.
        // Untuk contoh ini, kita asumsikan token valid ada, atau API Anda mengizinkan tanpa token.
        // Jika token tidak diberikan, API mungkin akan menolak.
        const AUTH_TOKEN = 'YOUR_TOKEN'; 

        const chatOutput = document.getElementById('chat-output');
        const chatForm = document.getElementById('chat-form');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const sendIcon = document.getElementById('send-icon');
        const loadingSpinner = document.getElementById('loading-spinner');
        
        // Elemen-elemen Pengaturan Lanjutan
        const advancedSettings = document.getElementById('advanced-settings');
        const toggleSettings = document.getElementById('toggle-settings');
        const settingsIcon = document.getElementById('settings-icon');
        const settingMode = document.getElementById('setting-mode');
        const settingDifficulty = document.getElementById('setting-difficulty');
        const settingLength = document.getElementById('setting-length');
        const settingLanguage = document.getElementById('setting-language');

        // Toggle visibility untuk Pengaturan Lanjutan
        toggleSettings.addEventListener('click', () => {
            advancedSettings.classList.toggle('max-h-0');
            advancedSettings.classList.toggle('settings-open'); // Menggunakan class custom
            settingsIcon.classList.toggle('rotate-180');
        });


        // Fungsi untuk menambahkan pesan teks ke antarmuka chat
        function addMessage(sender, text) {
            const messageContainer = document.createElement('div');
            messageContainer.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            const messageBubble = document.createElement('div');
            messageBubble.className = `p-3 rounded-xl max-w-xs sm:max-w-md shadow-md transition duration-200 ease-in-out transform`;

            if (sender === 'user') {
                messageBubble.classList.add('bg-indigo-500', 'text-white', 'rounded-bl-xl');
            } else {
                messageBubble.classList.add('bg-gray-200', 'text-gray-800', 'rounded-tr-xl');
            }

            messageBubble.innerHTML = `<p class="whitespace-pre-wrap">${text}</p>`;
            
            messageContainer.appendChild(messageBubble);
            chatOutput.appendChild(messageContainer);
            
            // Scroll dilakukan setelah semua elemen (termasuk saran) ditambahkan
        }
        
        // Fungsi untuk menambahkan tombol saran langsung ke chat history
        function addSuggestionsToChat(suggestions) {
            if (!suggestions || suggestions.length === 0) return;

            const suggestionsContainer = document.createElement('div');
            // Gunakan justify-start agar saran sejajar dengan pesan bot
            suggestionsContainer.className = 'flex flex-wrap gap-2 justify-start mt-2 mb-2'; 

            suggestions.forEach(suggestion => {
                const button = document.createElement('button');
                button.textContent = suggestion;
                // Styling tombol saran
                button.className = 'suggestion-button bg-indigo-100 text-indigo-700 text-sm py-1 px-3 rounded-full hover:bg-indigo-200 transition duration-150 active:scale-95';
                
                // Ketika tombol diklik, isi input dan kirim form
                button.onclick = () => {
                    userInput.value = suggestion;
                    chatForm.dispatchEvent(new Event('submit'));
                };
                suggestionsContainer.appendChild(button);
            });

            // Tambahkan container saran setelah pesan bot
            chatOutput.appendChild(suggestionsContainer);
            
            // Scroll ke bawah setelah saran ditambahkan
            chatOutput.scrollTop = chatOutput.scrollHeight;
        }

        // Fungsi untuk mengelola status loading
        function setLoading(isLoading) {
            userInput.disabled = isLoading;
            sendButton.disabled = isLoading;
            if (isLoading) {
                sendIcon.classList.add('hidden');
                loadingSpinner.classList.remove('hidden');
            } else {
                loadingSpinner.classList.add('hidden');
                sendIcon.classList.remove('hidden');
            }
        }
        
        // Inisialisasi chat dengan pesan pembuka dan saran awal
        function initializeChat() {
            addMessage('bot', 'Halo! Saya siap membantu menjelaskan topik seputar Artificial Intelligence (AI). Silakan ketik pertanyaan Anda!');
            addSuggestionsToChat(["Jelaskan apa itu artificial intelligence", "Apa saja yang bisa dilakukan AI?", "Bagaimana AI belajar seperti kita?"]);
        }

        // Fungsi untuk memanggil API
        async function fetchAIExplanation(prompt) {
            setLoading(true);

            // Ambil nilai pengaturan baru dari input
            const mode = settingMode.value;
            const difficulty = parseInt(settingDifficulty.value);
            const length = parseInt(settingLength.value);
            const language = settingLanguage.value;

            try {
                // Tampilkan pesan loading sementara
                addMessage('bot', '🤖 Sedang berpikir...');
                
                // Buat payload dengan semua parameter
                const payload = {
                    prompt: prompt,
                    mode: mode,
                    difficulty: difficulty,
                    length: length,
                    language: language
                };

                const response = await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${AUTH_TOKEN}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                // Hapus pesan loading
                if (chatOutput.lastElementChild) {
                    chatOutput.removeChild(chatOutput.lastElementChild);
                }

                if (response.ok && result.success) {
                    addMessage('bot', result.reply);
                    // Tambahkan saran langsung ke chat history
                    addSuggestionsToChat(result.suggestions); 
                } else {
                    const errorMessage = result.msg || 'Terjadi kesalahan saat memproses permintaan.';
                    addMessage('bot', `⚠️ Error: ${errorMessage}. Pastikan token API (AUTH_TOKEN) telah diatur dengan benar.`);
                }

            } catch (error) {
                console.error('Fetch error:', error);
                
                // Hapus pesan loading jika terjadi kesalahan
                if (chatOutput.lastElementChild) {
                     chatOutput.removeChild(chatOutput.lastElementChild);
                }

                addMessage('bot', `❌ Koneksi gagal. Coba cek konsol atau pastikan API endpoint/koneksi Anda berfungsi.`);
            } finally {
                setLoading(false);
            }
        }

        // Event listener untuk form submission
        chatForm.addEventListener('submit', function(event) {
            event.preventDefault();
            
            const prompt = userInput.value.trim();
            if (prompt === '') return;

            // Tambahkan pesan pengguna ke chat
            addMessage('user', prompt);
            
            // Reset input
            userInput.value = '';
            
            // Panggil API
            fetchAIExplanation(prompt);
        });

        // Panggil inisialisasi chat saat skrip dimuat
        initializeChat();
    </script>
</body>
</html>
