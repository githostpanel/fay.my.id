<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f5f5f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #4a90e2;
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .message-bubble h3,
        .message-bubble h4 {
            margin: 12px 0 8px 0;
            font-weight: 600;
            color: #2c3e50;
        }

        .message-bubble h3 {
            font-size: 16px;
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 4px;
            margin: 16px 0 8px 0;
            color: #2c3e50;
        }

        .message-bubble h4 {
            font-size: 14px;
            color: #4a90e2;
            margin: 12px 0 6px 0;
        }

        .message-bubble .formatted-content {
            line-height: 1.6;
        }

        .message-bubble .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #ddd, transparent);
            margin: 20px 0;
        }

        .message-bubble .section-header {
            font-size: 16px;
            font-weight: 700;
            color: #2c3e50;
            border-bottom: 2px solid #4a90e2;
            padding-bottom: 6px;
            margin: 20px 0 12px 0;
        }

        .message-bubble .subsection-header {
            font-size: 14px;
            font-weight: 600;
            color: #4a90e2;
            margin: 16px 0 8px 0;
            display: flex;
            align-items: center;
        }

        .message-bubble .subsection-header .bullet {
            background: #4a90e2;
            color: white;
            padding: 2px 6px;
            border-radius: 12px;
            font-size: 12px;
            margin-right: 8px;
            min-width: 24px;
            text-align: center;
        }

        .message-bubble .question-header {
            color: #2c3e50;
            font-weight: 600;
            display: block;
            margin: 12px 0 6px 0;
        }

        .message-bubble .italic-text {
            color: #666;
            font-style: italic;
            background: rgba(0,0,0,0.03);
            padding: 8px 12px;
            border-left: 3px solid #ddd;
            display: block;
            margin: 8px 0;
            border-radius: 0 4px 4px 0;
        }

        .message-bubble .main-question {
            margin: 10px 0;
            display: flex;
            align-items: flex-start;
        }

        .message-bubble .question-number {
            background: #4a90e2;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            margin-right: 10px;
            min-width: 28px;
            text-align: center;
            flex-shrink: 0;
        }

        .message-bubble .question-text {
            flex: 1;
            padding-top: 2px;
        }

        .message-bubble .sub-question {
            margin: 6px 0 6px 20px;
            display: flex;
            align-items: flex-start;
        }

        .message-bubble .sub-letter {
            background: #e8f4f8;
            color: #4a90e2;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            margin-right: 8px;
            min-width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .message-bubble .sub-text {
            flex: 1;
            padding-top: 1px;
        }

        .message-bubble .bullet-point {
            margin: 4px 0 4px 20px;
            color: #555;
        }

        .message-bubble .quoted-text {
            background: rgba(74, 144, 226, 0.05);
            border-left: 3px solid #4a90e2;
            padding: 12px 16px;
            margin: 12px 0;
            font-style: italic;
            color: #444;
            border-radius: 0 6px 6px 0;
        }

        .message-bubble .inline-sub {
            margin: 6px 0 6px 10px;
            display: flex;
            align-items: flex-start;
        }

        .message-bubble .inline-sub .sub-letter {
            background: #e8f4f8;
            color: #4a90e2;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 12px;
            margin-right: 8px;
            min-width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .message-bubble .inline-sub .sub-text {
            flex: 1;
            padding-top: 1px;
        }

        .message-bubble .math-inline {
            font-family: 'Times New Roman', serif;
            background: rgba(74, 144, 226, 0.08);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 1.05em;
            white-space: nowrap;
        }

        .message-bubble sup {
            font-size: 0.75em;
            vertical-align: super;
            line-height: 0;
        }

        .message-bubble sub {
            font-size: 0.75em;
            vertical-align: sub;
            line-height: 0;
        }

        .message-bubble .scoring-section {
            background: rgba(74, 144, 226, 0.05);
            border: 1px solid rgba(74, 144, 226, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            margin: 16px 0;
        }

        .message-bubble .total-score {
            background: #4a90e2;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 600;
            display: inline-block;
            margin-left: 8px;
        }

        .message-bubble strong {
            font-weight: 600;
            color: #2c3e50;
        }

        .message-bubble .math-block {
            text-align: center;
            font-family: 'Times New Roman', serif;
            font-size: 1.2em;
            margin: 12px 0;
            padding: 8px;
            background: rgba(74, 144, 226, 0.05);
            border-radius: 6px;
            border-left: 3px solid #4a90e2;
        }

        .message-bubble .math-inline {
            font-family: 'Times New Roman', serif;
            background: rgba(74, 144, 226, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 1.05em;
        }

        .message-bubble .math-boxed {
            border: 2px solid #4a90e2;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(74, 144, 226, 0.1);
            font-weight: bold;
            font-family: 'Times New Roman', serif;
            display: inline-block;
            margin: 2px;
        }

        .message-bubble .list-item {
            margin: 6px 0;
            padding-left: 20px;
            position: relative;
        }

        .message-bubble .list-number {
            position: absolute;
            left: 0;
            font-weight: 600;
            color: #4a90e2;
        }

        .message-bubble sup {
            font-size: 0.8em;
            vertical-align: super;
        }

        .message-bubble sub {
            font-size: 0.8em;
            vertical-align: sub;
        }

        .message-bubble code {
            background: rgba(0, 0, 0, 0.1);
            padding: 2px 4px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }

        .message-bubble pre {
            background: rgba(0, 0, 0, 0.05);
            padding: 8px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .message-bubble blockquote {
            border-left: 3px solid #4a90e2;
            padding-left: 12px;
            margin: 8px 0;
            color: #666;
            font-style: italic;
        }

        .message-bubble ol,
        .message-bubble ul {
            margin: 8px 0;
            padding-left: 20px;
        }

        .message-bubble li {
            margin: 4px 0;
        }

        .message.user .message-bubble {
            background: #4a90e2;
            color: white;
        }

        .message.assistant .message-bubble {
            background: #f1f1f1;
            color: #333;
        }

        .typing-indicator {
            display: none;
            align-self: flex-start;
            align-items: center;
            gap: 8px;
            padding: 12px 16px;
            background: #f1f1f1;
            border-radius: 18px;
            margin-bottom: 16px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        .typing-dot:nth-child(3) { animation-delay: 0s; }

        .input-area {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 12px;
        }

        .message-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 24px;
            outline: none;
            font-size: 14px;
            resize: none;
        }

        .message-input:focus {
            border-color: #4a90e2;
        }

        .send-btn {
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            background: #357abd;
        }

        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #c33;
            margin-bottom: 16px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
            }
            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>🤖 AI Assistant</h1>
            <button class="reset-btn" onclick="resetChat()">Reset</button>
        </div>

        <div class="messages-area" id="messagesArea">
            <!-- Pesan akan ditampilkan di sini -->
        </div>

        <div class="typing-indicator" id="typingIndicator">
            <span>AI sedang mengetik</span>
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>

        <div class="input-area">
            <input 
                type="text" 
                class="message-input" 
                id="messageInput" 
                placeholder="Ketik pesan Anda..."
                onkeypress="handleKeyPress(event)"
            >
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
	//dibuat dengan https://claude.ai/
        const API_URL = 'https://ai.hackclub.com/chat/completions';
        let conversation = [];

        // Inisialisasi
        function init() {
            addMessage('assistant', 'Halo! Saya adalah AI Assistant. Ada yang bisa saya bantu?');
        }

        // Tambah pesan ke chat
        function addMessage(role, content) {
            const messagesArea = document.getElementById('messagesArea');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            
            // Format content untuk tampilan yang lebih baik
            const formattedContent = formatMessage(content);
            bubble.innerHTML = formattedContent;
            
            messageDiv.appendChild(bubble);
            messagesArea.appendChild(messageDiv);
            
            // Scroll ke bawah
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // Format pesan untuk tampilan yang lebih baik
        function formatMessage(content) {
            // Escape HTML untuk keamanan
            content = content.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            
            // Format headers ### **text** menjadi h3
            content = content.replace(/###\s*\*\*(.*?)\*\*/g, '<h3>$1</h3>');
            
            // Format headers #### **text** menjadi h4
            content = content.replace(/####\s*\*\*(.*?)\*\*/g, '<h4>$1</h4>');
            
            // Format headers ### text menjadi h3
            content = content.replace(/###\s*(.*?)$/gm, '<h3>$1</h3>');
            
            // Format headers #### text menjadi h4
            content = content.replace(/####\s*(.*?)$/gm, '<h4>$1</h4>');
            
            // Format bold text (**text** menjadi <strong>text</strong>)
            content = content.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            
            // Format block math $...$
            content = content.replace(/\$\$(.*?)\$\$/gs, '<div class="math-block">$1</div>');
            
            // Format inline math $...$
            content = content.replace(/\$(.*?)\$/g, '<span class="math-inline">$1</span>');
            
            // Format boxed answers \boxed{...}
            content = content.replace(/\\boxed\{(.*?)\}/g, '<span class="math-boxed">$1</span>');
            
            // Format fractions \frac{a}{b}
            content = content.replace(/\\frac\{(.*?)\}\{(.*?)\}/g, '<sup>$1</sup>/<sub>$2</sub>');
            
            // Format text commands \text{...}
            content = content.replace(/\\text\{(.*?)\}/g, '$1');
            
            // Format numbered lists dengan indentasi
            content = content.replace(/^(\d+)\.\s(.+)$/gm, '<div class="list-item"><span class="list-number">$1.</span> $2</div>');
            
            // Format quotes/blockquotes (> text)
            content = content.replace(/^&gt;\s(.+)$/gm, '<blockquote>$1</blockquote>');
            
            // Format line breaks
            content = content.replace(/\n\s*\n/g, '</p><p>');
            content = content.replace(/\n/g, '<br>');
            
            // Wrap dalam paragraf
            content = '<p>' + content + '</p>';
            
            // Clean up empty paragraphs
            content = content.replace(/<p><\/p>/g, '');
            content = content.replace(/<p>(<h[3-4].*?<\/h[3-4]>)<\/p>/g, '$1');
            
            return content;
        }

        // Tambah pesan error
        function addError(message) {
            const messagesArea = document.getElementById('messagesArea');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            messagesArea.appendChild(errorDiv);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        // Tampilkan typing indicator
        function showTyping(show) {
            const indicator = document.getElementById('typingIndicator');
            const messagesArea = document.getElementById('messagesArea');
            
            if (show) {
                indicator.style.display = 'flex';
                messagesArea.scrollTop = messagesArea.scrollHeight;
            } else {
                indicator.style.display = 'none';
            }
        }

        // Kirim pesan
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const sendBtn = document.getElementById('sendBtn');
            const message = input.value.trim();
            
            if (!message || sendBtn.disabled) return;
            
            // Disable input
            input.disabled = true;
            sendBtn.disabled = true;
            
            // Tampilkan pesan user
            addMessage('user', message);
            input.value = '';
            
            // Tambah ke conversation history
            conversation.push({ role: 'user', content: message });
            
            // Tampilkan typing
            showTyping(true);
            
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: conversation
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    let aiResponse = data.choices[0].message.content;
                    
                    // Hapus blok <think> jika ada
                    aiResponse = aiResponse.replace(/<think>[\s\S]*?<\/think>\s*/g, '').trim();
                    
                    // Tambah ke conversation
                    conversation.push({ role: 'assistant', content: aiResponse });
                    
                    // Tampilkan pesan AI
                    addMessage('assistant', aiResponse);
                } else {
                    throw new Error('Response tidak valid dari API');
                }
                
            } catch (error) {
                console.error('Error:', error);
                addError(`Error: ${error.message}`);
                
                // Hapus pesan user terakhir dari history karena gagal
                if (conversation.length > 0 && conversation[conversation.length - 1].role === 'user') {
                    conversation.pop();
                }
            } finally {
                // Enable input kembali
                showTyping(false);
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();
            }
        }

        // Handle Enter key
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Reset chat
        function resetChat() {
            if (confirm('Yakin ingin mereset percakapan?')) {
                conversation = [];
                document.getElementById('messagesArea').innerHTML = '';
                init();
            }
        }

        // Jalankan saat halaman dimuat
        window.onload = init;
    </script>
	
	<script>
if (window.top !== window.self) {
  // ini adalah script anti iframe ,jika muncul peringatan di bawah artinya website sedang di dalam iframe
  document.body.innerHTML = "<h1>⚠️ Embedding tidak diizinkan</h1>";
}
</script>

</body>
</html>
