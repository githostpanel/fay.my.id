<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot AI</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .chat-container {
            height: 80vh;
            max-height: 80vh;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .chat-container::-webkit-scrollbar {
            display: none;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        .message-bubble.user {
            background-color: #3b82f6;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .message-bubble.assistant {
            background-color: #e5e7eb;
            color: #1f2937;
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

<div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl flex flex-col h-[90vh]">

    <!-- Header -->
    <div class="p-5 border-b border-gray-200">
        <h1 class="text-2xl font-bold text-gray-800">Chatbot AI</h1>
        <p class="text-sm text-gray-500 mt-1">Kunci Jawaban Soal</p>
    </div>

    <!-- Chat -->
    <div id="chat-container" class="chat-container flex-grow p-5 space-y-4 flex flex-col"></div>

    <!-- Input -->
    <div class="p-5 border-t border-gray-200 flex items-center gap-2">
        <input
            type="text"
            id="user-input"
            placeholder="Ketik pesan Anda..."
            class="flex-grow p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />

        <button id="send-button" class="bg-blue-600 text-white p-3 rounded-xl hover:bg-blue-700 shadow-md">
            ➤
        </button>

        <button id="reset-button" class="bg-red-500 text-white p-3 rounded-xl hover:bg-red-600 shadow-md">
            ↺
        </button>

        <div id="loading-spinner" class="hidden">
            <svg class="spinner w-6 h-6 text-gray-500" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                      d="M4 12a8 8 0 018-8V0C5.37 0 0 5.37 0 12h4z"/>
            </svg>
        </div>
    </div>

</div>

<script>
const chatContainer = document.getElementById('chat-container');
const userInput = document.getElementById('user-input');
const sendButton = document.getElementById('send-button');
const resetButton = document.getElementById('reset-button');
const loadingSpinner = document.getElementById('loading-spinner');

const API_URL = "https://text.pollinations.ai/prompt/";

const SYSTEM_PROMPT = `
Anda adalah asisten AI yang sangat pintar menjawab pertanyaan secara ringkas, akurat,
dan sopan dalam bahasa Indonesia. Setiap pertanyaan dijawab langsung tanpa penjelasan tambahan.
Chatbot ini dibuat oleh MirongDev. Jangan menyebutkan teknologi atau platform lain.
`;

function addMessage(role, content) {
    const wrapper = document.createElement('div');
    wrapper.className = 'flex flex-col max-w-lg break-words';

    const bubble = document.createElement('div');
    bubble.className = 'message-bubble rounded-2xl p-3 shadow';
    bubble.textContent = content;

    if (role === 'user') {
        wrapper.classList.add('self-end', 'items-end');
        bubble.classList.add('user');
    } else {
        wrapper.classList.add('self-start', 'items-start');
        bubble.classList.add('assistant');
    }

    wrapper.appendChild(bubble);
    chatContainer.appendChild(wrapper);
    chatContainer.scrollTop = chatContainer.scrollHeight;
}

function resetConversation() {
    chatContainer.innerHTML = '';
    addMessage('assistant', 'Halo! Saya chatbot buatan MirongDev. Ada yang bisa saya bantu?');
}

async function sendMessage() {
    const message = userInput.value.trim();
    if (!message) return;

    addMessage('user', message);
    userInput.value = '';

    loadingSpinner.classList.remove('hidden');
    sendButton.disabled = true;

    try {
        const url =
            API_URL +
            encodeURIComponent(message) +
            `?model=openai-fast&system=` +
            encodeURIComponent(SYSTEM_PROMPT);

        const response = await fetch(url);
        if (!response.ok) throw new Error("API Error");

        const aiText = await response.text();
        addMessage('assistant', aiText);

    } catch (err) {
        addMessage('assistant', 'Terjadi kesalahan. Silakan coba lagi.');
    } finally {
        loadingSpinner.classList.add('hidden');
        sendButton.disabled = false;
        userInput.focus();
    }
}

sendButton.addEventListener('click', sendMessage);
resetButton.addEventListener('click', resetConversation);

userInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
});

window.onload = resetConversation;
</script>

</body>
</html>
