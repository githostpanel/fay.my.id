<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .chat-container {
            height: 80vh;
            max-height: 80vh;
            overflow-y: auto;
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE and Edge */
        }

        .chat-container::-webkit-scrollbar {
            display: none; /* Chrome, Safari, and Opera */
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        .message-bubble.user {
            background-color: #3b82f6;
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }

        .message-bubble.assistant {
            background-color: #e5e7eb;
            color: #1f2937;
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4 sm:p-6 md:p-8">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl flex flex-col h-[90vh]">
        <!-- Header -->
        <div class="p-5 border-b border-gray-200">
            <h1 class="text-2xl font-bold text-gray-800">Chatbot AI</h1>
            <p class="text-sm text-gray-500 mt-1">Menggunakan API Hack Club</p>
        </div>

        <!-- Chat Container -->
        <div id="chat-container" class="chat-container flex-grow p-5 space-y-4 flex flex-col">
            <!-- Pesan akan ditambahkan di sini secara dinamis -->
        </div>

        <!-- Input Area -->
        <div class="p-5 border-t border-gray-200 flex items-center gap-2">
            <input type="text" id="user-input" placeholder="Ketik pesan Anda..." class="flex-grow p-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-200">
            <button id="send-button" class="bg-blue-600 text-white p-3 rounded-xl hover:bg-blue-700 transition-colors duration-200 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                    <path d="M3.478 2.405a.75.75 0 0 0-.926.94l2.432 7.917H12.75a.75.75 0 0 1 0 1.5H4.984l-2.432 7.918a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.405Z" />
                </svg>
            </button>
            <button id="reset-button" class="bg-red-500 text-white p-3 rounded-xl hover:bg-red-600 transition-colors duration-200 shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                    <path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25zm.53 5.47a.75.75 0 0 0-1.06 0l-3 3a.75.75 0 1 0 1.06 1.06L10.97 9.88V16.5a.75.75 0 0 0 1.5 0V9.88l1.47 1.47a.75.75 0 1 0 1.06-1.06l-3-3z" clip-rule="evenodd" />
                </svg>
            </button>
            <div id="loading-spinner" class="hidden">
                <svg class="spinner w-6 h-6 text-gray-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.963l3-2.672z"></path>
                </svg>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const resetButton = document.getElementById('reset-button');
        const loadingSpinner = document.getElementById('loading-spinner');
        
        const API_URL = 'https://ai.hackclub.com/chat/completions';

        // Array untuk menyimpan riwayat percakapan
        let conversationHistory = [];

        // Fungsi untuk menambahkan pesan ke antarmuka
        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('flex', 'flex-col', 'max-w-xs', 'sm:max-w-sm', 'md:max-w-md', 'lg:max-w-lg', 'break-words');
            
            const bubbleDiv = document.createElement('div');
            bubbleDiv.classList.add('message-bubble', 'rounded-2xl', 'p-3', 'shadow');
            bubbleDiv.textContent = content;

            if (role === 'user') {
                messageDiv.classList.add('self-end', 'items-end');
                bubbleDiv.classList.add('user');
            } else {
                messageDiv.classList.add('self-start', 'items-start');
                bubbleDiv.classList.add('assistant');
            }

            messageDiv.appendChild(bubbleDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight; // Gulir ke bawah
        }

        // Fungsi untuk mereset percakapan
        function resetConversation() {
    chatContainer.innerHTML = ''; // Hapus pesan dari UI
   conversationHistory = [
    { 
        role: 'system', 
        content: 'Anda adalah asisten AI yang ramah dan membantu. Berikan jawaban yang ringkas dan sopan dalam bahasa Indonesia. Chatbot ini dibuat oleh MirongDev dengan model krenyez. Tidak ada kaitannya dengan platform atau teknologi lain. Dengan alasan apapun, jangan menyebutkan sumber AI kecuali MirongDev.' 
    }
];
    addMessage('assistant', 'Halo! Saya adalah chatbot buatan MirongDev. Ada yang bisa saya bantu?');
}
        // Menambahkan pesan sambutan saat halaman dimuat
        window.onload = () => {
            resetConversation();
        };

        // Fungsi untuk mengirim pesan
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Tambahkan pesan pengguna ke riwayat
            conversationHistory.push({ role: 'user', content: message });
            addMessage('user', message);
            userInput.value = '';
            
            // Tampilkan loading spinner
            loadingSpinner.classList.remove('hidden');
            sendButton.disabled = true;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: conversationHistory
                    })
                });

                if (!response.ok) {
                    throw new Error(`Error API: ${response.status}`);
                }

                const data = await response.json();
                let aiMessage = data.choices[0].message.content;

                // Menghilangkan blok <think>...</think> dari pesan
                aiMessage = aiMessage.replace(/<think>[\s\S]*?<\/think>\s*/, '').trim();

                // Tambahkan pesan asisten ke riwayat
                conversationHistory.push({ role: 'assistant', content: aiMessage });
                addMessage('assistant', aiMessage);

            } catch (error) {
                console.error('Error saat mengambil data dari API:', error);
                addMessage('assistant', 'Maaf, terjadi kesalahan. Silakan coba lagi.');
            } finally {
                // Sembunyikan loading spinner
                loadingSpinner.classList.add('hidden');
                sendButton.disabled = false;
                userInput.focus();
            }
        }

        // Event listener untuk tombol kirim
        sendButton.addEventListener('click', sendMessage);

        // Event listener untuk tombol reset
        resetButton.addEventListener('click', resetConversation);

        // Event listener untuk tombol 'Enter' pada input
        userInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
