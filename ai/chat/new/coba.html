<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot AI - Pollinations</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f2f5;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding: 10px;
    }
    .chat-wrapper {
      width: 100%;
      max-width: 420px;
      height: 90vh;
      max-height: 650px;
      background: white;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .chat-header {
      background: #007bff;
      color: white;
      padding: 12px 16px;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-header select, .chat-header button {
      font-size: 14px;
      margin-left: 6px;
      border: none;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
	  
    }
    .chat-header select {
      background: white;
      color: #333;
    }
    .chat-header button {
      background: #dc3545;
      color: white;
    }
	
	
	
	.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px;
  background: #222;
  color: #fff;
  border-bottom: 1px solid #444;
  flex-wrap: wrap; /* biar nggak overflow ke kanan */
}

.chat-header select {
  max-width: 200px;  /* batasi lebar */
  width: 100%;       /* fleksibel */
  padding: 4px;
  border-radius: 6px;
  font-size: 14px;
  background: #333;
  color: #fff;
  border: 1px solid #555;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}



    .chat-messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #fafafa;
    }
    .message {
      margin: 8px 0;
      padding: 10px 14px;
      border-radius: 10px;
      max-width: 80%;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-in-out;
    }
    .user-message {
      background: #007bff;
      color: white;
      margin-left: auto;
    }
    .ai-message {
      background: #eaeaea;
      color: #333;
      margin-right: auto;
    }
    .chat-input {
      display: flex;
      border-top: 1px solid #ddd;
      background: white;
    }
    .chat-input input {
      flex: 1;
      border: none;
      padding: 12px;
      font-size: 16px;
      outline: none;
    }
    .chat-input button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      cursor: pointer;
    }
    .chat-input button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }
    .loading {
      font-style: italic;
      color: #666;
      font-size: 14px;
      margin: 8px 0;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
	
	
	@media (max-width: 500px) {
  .chat-header select {
    max-width: 120px; /* lebih kecil di HP */
    font-size: 12px;
  }
}
  </style>
</head>
<body>
  <div class="chat-wrapper">
    <div class="chat-header">
      <span>🤖 Chatbot AI</span>
      <div>
        <select id="modelSelect">
          <option value="openai">openai (default)</option>
		  <option value="openai-fast">openai Fast (default)</option>
        </select>
        <button id="resetBtn">Reset</button>
      </div>
    </div>

    <div id="chatMessages" class="chat-messages"></div>

    <div class="chat-input">
      <input id="userInput" type="text" placeholder="Ketik pesan...">
      <button id="sendBtn">Kirim</button>
    </div>
  </div>

<script>
  const API_URL = "https://text.pollinations.ai";
  const chatMessages = document.getElementById("chatMessages");
  const userInput = document.getElementById("userInput");
  const sendBtn = document.getElementById("sendBtn");
  const modelSelect = document.getElementById("modelSelect");
  const resetBtn = document.getElementById("resetBtn");

  let currentModel = "openai"; // default
  let history = [
    { role: "system", content: "kamu adalah AI yang dibuat oleh mirongdev dengan model yang dipilih" }
  ];

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.classList.add("message", role === "user" ? "user-message" : "ai-message");
    div.innerHTML = text.replace(/\n/g, "<br>");
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
  }

  function addLoading() {
    const div = document.createElement("div");
    div.classList.add("loading");
    div.id = "loadingMsg";
    div.textContent = "AI sedang mengetik...";
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function removeLoading() {
    const loading = document.getElementById("loadingMsg");
    if (loading) loading.remove();
  }

  async function typeMessage(element, text, speed = 25) {
    element.innerHTML = "";
    for (let i = 0; i < text.length; i++) {
      element.innerHTML += text[i] === "\n" ? "<br>" : text[i];
      chatMessages.scrollTop = chatMessages.scrollHeight;
      await new Promise(resolve => setTimeout(resolve, speed));
    }
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    addMessage("user", text);
    history.push({ role: "user", content: text });
    userInput.value = "";
    sendBtn.disabled = true;
    addLoading();

    try {
      const res = await fetch(`${API_URL}/${currentModel}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: currentModel,
          messages: history
        })
      });

      let reply = "(tidak ada balasan)";
      try {
        const data = await res.json();
        if (data?.choices?.[0]?.message?.content) {
          reply = data.choices[0].message.content;
        } else if (data?.choices?.[0]?.text) {
          reply = data.choices[0].text;
        } else if (data?.choices?.[0]) {
          reply = JSON.stringify(data.choices[0]);
        }
      } catch {
        reply = await res.text();
      }

      removeLoading();
      const aiDiv = addMessage("ai", ""); // placeholder
      await typeMessage(aiDiv, reply || "(kosong)");
      history.push({ role: "assistant", content: reply });
    } catch (err) {
      removeLoading();
      addMessage("ai", "❌ Error: " + err.message);
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  userInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  modelSelect.addEventListener("change", () => {
    currentModel = modelSelect.value;
    resetChat();
  });

  resetBtn.addEventListener("click", resetChat);

  function resetChat() {
    history = [{ role: "system", content: "You are a helpful assistant." }];
    chatMessages.innerHTML = "";
    addMessage("ai", "🔄 Chat telah direset. Model: " + currentModel);
  }

  // 🔥 ambil list model dari API lalu tambahkan ke select (tidak menghapus default)
// 🔥 ambil list model dari API lalu tambahkan ke select (urut A-Z)
async function loadModels() {
  try {
    const res = await fetch(`${API_URL}/models`);
    const models = await res.json();

    // urutkan hasil models berdasarkan nama (atau description kalau mau)
    models.sort((a, b) => a.name.localeCompare(b.name));

    models.forEach(m => {
      // cek agar tidak duplikat
      if (![...modelSelect.options].some(opt => opt.value === m.name)) {
        const opt = document.createElement("option");
        opt.value = m.name;
        opt.textContent = `${m.name}${m.description ? " - " + m.description : ""}`;
        modelSelect.appendChild(opt);
      }
    });
  } catch (err) {
    console.error("Gagal ambil model:", err);
  }
}


  loadModels();
  addMessage("ai", "Halo 👋! Saya siap membantu kamu. Pilih model di atas lalu mulai chat!");
</script>
</body>
</html>
