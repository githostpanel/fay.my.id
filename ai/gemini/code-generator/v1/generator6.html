<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Kode AI Gemini</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }
        /* Custom styles for the Ace Editor container */
        #editor {
            border-radius: 0.5rem;
            border: 1px solid #334155;
            padding: 1rem;
            width: 100%;
            height: 400px;
        }
        /* Custom styles for iframe to fill space */
        .preview-iframe-container {
            width: 100%;
            height: 500px;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            overflow: hidden;
        }
        .preview-iframe {
            width: 100%;
            height: 100%;
            border: none;
            transition: width 0.3s, height 0.3s;
        }
        /* Make Ace Editor line numbers and text bigger */
        .ace_editor {
            font-size: 16px;
        }
        .ace_gutter {
            padding-left: 5px;
            padding-right: 5px;
        }
    </style>
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, addDoc, getDocs, onSnapshot, query, orderBy, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        
        // Global variables provided by the Canvas environment
        window.__app_id = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        window.__firebase_config = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        window.__initial_auth_token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : undefined;

        window.firebaseApp = initializeApp(window.__firebase_config);
        window.db = getFirestore(window.firebaseApp);
        window.auth = getAuth(window.firebaseApp);

        // Sign in with custom token or anonymously
        if (window.__initial_auth_token) {
            signInWithCustomToken(window.auth, window.__initial_auth_token).catch((error) => {
                console.error("Error signing in with custom token:", error);
            });
        } else {
            signInAnonymously(window.auth).catch((error) => {
                console.error("Error signing in anonymously:", error);
            });
        }
    </script>
    <!-- Ace Editor CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.js"></script>
</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-4xl space-y-8 dark:bg-slate-800 dark:text-gray-100 light:bg-white light:text-gray-900 transition-colors duration-300 relative">
        <button id="themeToggleBtn" class="absolute top-4 right-4 p-2 rounded-full text-gray-400 dark:text-gray-400 light:text-gray-600 hover:bg-slate-700 dark:hover:bg-slate-700 light:hover:bg-gray-200 transition-colors duration-300" aria-label="Toggle dark/light mode">
            <!-- Sun icon for light mode -->
            <svg id="sunIcon" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <!-- Moon icon for dark mode -->
            <svg id="moonIcon" class="h-6 w-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
            </svg>
        </button>
        <div class="text-center space-y-2">
            <h1 class="text-4xl font-extrabold text-blue-400">Gemini Code Generator</h1>
            <p class="text-gray-300 dark:text-gray-300 light:text-gray-700">Hasilkan kode dalam berbagai bahasa pemrograman dengan AI.</p>
        </div>

        <!-- Formulir Input -->
        <div class="space-y-4">
            <div>
                <label for="prompt" class="block text-gray-400 dark:text-gray-400 light:text-gray-700 font-medium mb-1">Prompt (Contoh: "Buat fungsi Python untuk menghitung faktorial")</label>
                <textarea id="prompt" rows="4" class="w-full p-3 rounded-lg bg-slate-700 text-gray-50 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-300 dark:bg-slate-700 dark:text-gray-50 light:bg-gray-100 light:text-gray-900 light:border-gray-300"></textarea>
            </div>
            <div>
                <label for="language" class="block text-gray-400 dark:text-gray-400 light:text-gray-700 font-medium mb-1">Bahasa Pemrograman</label>
                <select id="language" class="w-full p-3 rounded-lg bg-slate-700 text-gray-50 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all duration-300 dark:bg-slate-700 dark:text-gray-50 light:bg-gray-100 light:text-gray-900 light:border-gray-300">
                    <option value="HTML">HTML</option>
                    <option value="Python">Python</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="Java">Java</option>
                    <option value="C++">C++</option>
                    <option value="Go">Go</option>
                    <option value="Ruby">Ruby</option>
                    <option value="PHP">PHP</option>
                    <option value="Swift">Swift</option>
                    <option value="Kotlin">Kotlin</option>
                    <option value="TypeScript">TypeScript</option>
                </select>
            </div>
            <button id="generateBtn" class="w-full py-3 px-4 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-500/50 transition-all duration-300 shadow-lg">
                Hasilkan Kode
            </button>
        </div>

        <!-- Saran Prompt -->
        <div class="space-y-2">
            <h3 class="text-sm font-semibold text-gray-400 dark:text-gray-400 light:text-gray-700">Saran Prompt:</h3>
            <div id="promptSuggestions" class="flex flex-wrap gap-2">
                <!-- Buttons will be injected here by JavaScript -->
            </div>
        </div>

        <!-- Area Hasil -->
        <div id="results" class="hidden">
            <h2 class="text-xl font-bold mb-2 text-gray-200 dark:text-gray-200 light:text-gray-800">Kode yang Dihasilkan:</h2>
            <div class="bg-slate-900 rounded-lg p-4 dark:bg-slate-900 light:bg-gray-200">
                <div class="flex justify-between items-center mb-4">
                    <button id="editorThemeToggleBtn" class="flex items-center gap-1 py-1 px-3 bg-slate-700 text-gray-400 rounded-full hover:bg-slate-600 transition-colors duration-300 dark:bg-slate-700 dark:hover:bg-slate-600 light:bg-gray-300 light:text-gray-700 light:hover:bg-gray-400">
                        <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" d="M10 2a8 8 0 100 16 8 8 0 000-16zM4.646 4.646a.5.5 0 010 .708L4.354 5.354l-1.414 1.414a.5.5 0 01-.708 0L.94 6.707a.5.5 0 010-.707l1.414-1.414a.5.5 0 01.708 0zM12 2a.5.5 0 01.5.5v2a.5.5 0 01-1 0v-2A.5.5 0 0112 2zm6.707 3.293a.5.5 0 010 .707l-1.414 1.414a.5.5 0 01-.707 0l-1.415-1.414a.5.5 0 010-.707l1.414-1.414a.5.5 0 01.707 0l1.415 1.414zM10 18a.5.5 0 01-.5-.5v-2a.5.5 0 011 0v2a.5.5 0 01-.5.5z" clip-rule="evenodd"></path>
                        </svg>
                        <span id="editorThemeText">Mode Terang</span>
                    </button>
                    <div class="flex justify-end gap-2">
                        <button id="runBtn" class="flex items-center gap-1 py-1 px-3 bg-slate-700 text-gray-400 rounded-full hover:bg-slate-600 transition-colors duration-300 dark:bg-slate-700 dark:hover:bg-slate-600 light:bg-gray-300 light:text-gray-700 light:hover:bg-gray-400" title="Jalankan Kode (Hanya untuk HTML)">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" />
                            </svg>
                            Jalankan
                        </button>
                        <button id="downloadBtn" class="flex items-center gap-1 py-1 px-3 bg-slate-700 text-gray-400 rounded-full hover:bg-slate-600 transition-colors duration-300 dark:bg-slate-700 dark:hover:bg-slate-600 light:bg-gray-300 light:text-gray-700 light:hover:bg-gray-400" title="Unduh Kode">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M13.52 7.152a.75.75 0 011.02.24L16 10.51l1.46-3.118a.75.75 0 011.02-.24l1 1a.75.75 0 010 1.06L17.06 13a.75.75 0 01-1.06 0L14 11.94l-2.94 2.94a.75.75 0 01-1.06 0L8 11.94l-3.06 3.06a.75.75 0 01-1.06 0L2 13.06a.75.75 0 010-1.06L5.94 8l-2.94-2.94a.75.75 0 010-1.06L3.94 3a.75.75 0 011.06 0L8 6.94l2.94-2.94a.75.75 0 011.06 0L14 6.94l2.94-2.94a.75.75 0 011.06 0L19.06 5z" />
                                <path d="M10 2a.75.75 0 01.75.75v5.5a.75.75 0 01-1.5 0v-5.5A.75.75 0 0110 2zM10 15a.75.75 0 01.75.75v1.5a.75.75 0 01-1.5 0v-1.5A.75.75 0 0110 15z" />
                            </svg>
                            Unduh
                        </button>
                        <button id="copyBtn" class="flex items-center gap-1 py-1 px-3 bg-slate-700 text-gray-400 rounded-full hover:bg-slate-600 transition-colors duration-300 dark:bg-slate-700 dark:hover:bg-slate-600 light:bg-gray-300 light:text-gray-700 light:hover:bg-gray-400" title="Salin Kode">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M7 9a2 2 0 012-2h6a2 2 0 012 2v6a2 2 0 01-2 2H9a2 2 0 01-2-2V9z" />
                                <path d="M5 3a2 2 0 00-2 2v6a2 2 0 002 2V5h8a2 2 0 00-2-2H5z" />
                            </svg>
                            Salin
                        </button>
                    </div>
                </div>
                <div id="editor"></div>
            </div>
        </div>
        
        <!-- Preview -->
        <div id="previewContainer" class="hidden">
            <h2 class="text-xl font-bold mb-2 text-gray-200 dark:text-gray-200 light:text-gray-800">Pratinjau Kode:</h2>
            <div class="flex justify-start items-center space-x-2 mb-4">
                <button id="desktopViewBtn" class="py-1 px-3 rounded-full text-xs bg-slate-700 text-gray-400 hover:bg-slate-600 transition-colors duration-300 dark:bg-slate-700 dark:hover:bg-slate-600 light:bg-gray-300 light:text-gray-700 light:hover:bg-gray-400">
                    Desktop
                </button>
                <button id="tabletViewBtn" class="py-1 px-3 rounded-full text-xs bg-slate-700 text-gray-400 hover:bg-slate-600 transition-colors duration-300 dark:bg-slate-700 dark:hover:bg-slate-600 light:bg-gray-300 light:text-gray-700 light:hover:bg-gray-400">
                    Tablet
                </button>
                <button id="mobileViewBtn" class="py-1 px-3 rounded-full text-xs bg-slate-700 text-gray-400 hover:bg-slate-600 transition-colors duration-300 dark:bg-slate-700 dark:hover:bg-slate-600 light:bg-gray-300 light:text-gray-700 light:hover:bg-gray-400">
                    Seluler
                </button>
                <input type="text" id="customWidthInput" placeholder="Lebar (px)" class="w-24 p-1 rounded bg-slate-700 text-gray-50 border border-slate-600 focus:outline-none focus:ring-1 focus:ring-blue-500 text-xs dark:bg-slate-700 dark:text-gray-50 light:bg-gray-100 light:text-gray-900">
                <input type="text" id="customHeightInput" placeholder="Tinggi (px)" class="w-24 p-1 rounded bg-slate-700 text-gray-50 border border-slate-600 focus:outline-none focus:ring-1 focus:ring-blue-500 text-xs dark:bg-slate-700 dark:text-gray-50 light:bg-gray-100 light:text-gray-900">
                <button id="customViewBtn" class="py-1 px-3 rounded-full text-xs bg-blue-600 text-white hover:bg-blue-700 transition-colors duration-300">
                    Sesuaikan
                </button>
            </div>
            <div class="preview-iframe-container">
                <iframe id="previewFrame" class="preview-iframe"></iframe>
            </div>
        </div>

        <!-- History Section -->
        <div id="historyContainer" class="space-y-4 hidden">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-gray-200 dark:text-gray-200 light:text-gray-800">Riwayat</h2>
                <p class="text-sm text-gray-400 dark:text-gray-400 light:text-gray-700">ID Pengguna: <span id="userIdDisplay" class="font-mono text-xs"></span></p>
                <button id="clearHistoryBtn" class="py-1 px-3 bg-red-600 text-white rounded-full text-sm hover:bg-red-700 transition-colors duration-300">Hapus Riwayat</button>
            </div>
            <div id="historyList" class="space-y-2">
                <!-- History items will be injected here -->
            </div>
        </div>

        <!-- Loading dan Modal Pesan -->
        <div id="loading" class="hidden text-center text-blue-400 font-medium">
            <div class="flex items-center justify-center space-x-2">
                <svg class="animate-spin h-6 w-6 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Sedang menghasilkan kode...</span>
            </div>
        </div>

        <div id="messageModal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center p-4 z-50">
            <div class="bg-slate-800 p-6 rounded-lg shadow-xl max-w-sm w-full space-y-4 text-center dark:bg-slate-800 light:bg-white transition-colors duration-300">
                <h3 id="modalTitle" class="text-xl font-bold text-gray-100 dark:text-gray-100 light:text-gray-900"></h3>
                <p id="modalMessage" class="text-gray-300 dark:text-gray-300 light:text-gray-700"></p>
                <button id="closeModalBtn" class="w-full py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-300">OK</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import "https://cdnjs.cloudflare.com/ajax/libs/ace/1.4.12/ace.js";

        document.addEventListener('DOMContentLoaded', () => {
            const promptInput = document.getElementById('prompt');
            const languageSelect = document.getElementById('language');
            const generateBtn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const resultsDiv = document.getElementById('results');
            const copyBtn = document.getElementById('copyBtn');
            const runBtn = document.getElementById('runBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const messageModal = document.getElementById('messageModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const previewContainer = document.getElementById('previewContainer');
            const previewFrame = document.getElementById('previewFrame');
            const themeToggleBtn = document.getElementById('themeToggleBtn');
            const sunIcon = document.getElementById('sunIcon');
            const moonIcon = document.getElementById('moonIcon');
            const historyContainer = document.getElementById('historyContainer');
            const historyList = document.getElementById('historyList');
            const clearHistoryBtn = document.getElementById('clearHistoryBtn');
            const userIdDisplay = document.getElementById('userIdDisplay');
            const editorThemeToggleBtn = document.getElementById('editorThemeToggleBtn');
            const editorThemeText = document.getElementById('editorThemeText');
            const desktopViewBtn = document.getElementById('desktopViewBtn');
            const tabletViewBtn = document.getElementById('tabletViewBtn');
            const mobileViewBtn = document.getElementById('mobileViewBtn');
            const customViewBtn = document.getElementById('customViewBtn');
            const customWidthInput = document.getElementById('customWidthInput');
            const customHeightInput = document.getElementById('customHeightInput');

            // Initialize Ace Editor
            const editor = ace.edit("editor");
            editor.getSession().setMode("ace/mode/javascript");
            editor.setFontSize("16px");
            editor.getSession().setUseWrapMode(true);
            
            const aceThemes = {
                dark: 'tomorrow_night_eighties',
                light: 'chrome'
            };
            let currentEditorTheme = 'dark';
            editor.setTheme(`ace/theme/${aceThemes.dark}`);

            // Disable action buttons initially
            copyBtn.disabled = true;
            runBtn.disabled = true;
            downloadBtn.disabled = true;
            const actionButtons = [copyBtn, runBtn, downloadBtn];

            // Theme toggle logic (for the main app UI)
            function applyTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                    sunIcon.classList.remove('hidden');
                    moonIcon.classList.add('hidden');
                } else {
                    document.documentElement.classList.remove('dark');
                    sunIcon.classList.add('hidden');
                    moonIcon.classList.remove('hidden');
                }
            }

            // Load theme preference from localStorage
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                applyTheme(false);
            } else {
                applyTheme(true);
            }

            themeToggleBtn.addEventListener('click', () => {
                const isDark = document.documentElement.classList.contains('dark');
                applyTheme(!isDark);
                localStorage.setItem('theme', isDark ? 'light' : 'dark');
            });

            editorThemeToggleBtn.addEventListener('click', () => {
                if (currentEditorTheme === 'dark') {
                    editor.setTheme(`ace/theme/${aceThemes.light}`);
                    editorThemeText.textContent = "Mode Gelap";
                    currentEditorTheme = 'light';
                } else {
                    editor.setTheme(`ace/theme/${aceThemes.dark}`);
                    editorThemeText.textContent = "Mode Terang";
                    currentEditorTheme = 'dark';
                }
            });

            desktopViewBtn.addEventListener('click', () => {
                previewFrame.style.width = '100%';
                previewFrame.style.height = '100%';
                showMessageModal("Info", "Pratinjau diubah ke mode Desktop.");
            });

            tabletViewBtn.addEventListener('click', () => {
                previewFrame.style.width = '768px';
                previewFrame.style.height = '1024px';
                showMessageModal("Info", "Pratinjau diubah ke mode Tablet.");
            });

            mobileViewBtn.addEventListener('click', () => {
                previewFrame.style.width = '375px';
                previewFrame.style.height = '667px';
                showMessageModal("Info", "Pratinjau diubah ke mode Seluler.");
            });

            customViewBtn.addEventListener('click', () => {
                const width = customWidthInput.value;
                const height = customHeightInput.value;
                if (width && height && !isNaN(width) && !isNaN(height)) {
                    previewFrame.style.width = `${width}px`;
                    previewFrame.style.height = `${height}px`;
                    showMessageModal("Info", `Pratinjau diubah ke ukuran kustom: ${width}x${height}px.`);
                } else {
                    showMessageModal("Peringatan", "Masukkan nilai numerik yang valid untuk lebar dan tinggi.");
                }
            });

            const promptSuggestions = [
                "Buat fungsi Python untuk menghitung faktorial",
                "Buat laman web HTML sederhana dengan formulir kontak",
                "Tulis kelas Java untuk objek 'Buku'",
                "Buat fungsi JavaScript yang memvalidasi alamat email",
                "Buat kode PHP untuk menghubungkan ke database MySQL",
                "Tulis program C++ untuk mencari bilangan prima",
                "Buat skrip Python untuk analisis data dengan Pandas",
                "Tulis fungsi JavaScript yang mengurutkan array",
            ];
            const promptSuggestionsContainer = document.getElementById('promptSuggestions');
            promptSuggestions.forEach(prompt => {
                const button = document.createElement('button');
                button.textContent = prompt;
                button.classList.add('py-1', 'px-3', 'rounded-full', 'text-xs', 'bg-slate-700', 'text-gray-400', 'hover:bg-slate-600', 'transition-colors', 'duration-300', 'dark:bg-slate-700', 'dark:hover:bg-slate-600', 'light:bg-gray-300', 'light:text-gray-700', 'light:hover:bg-gray-400');
                button.addEventListener('click', () => {
                    promptInput.value = prompt;
                });
                promptSuggestionsContainer.appendChild(button);
            });

            const apiKey = "";
            const apiUrl = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=" + apiKey;
            let chatHistory = [];
            let userId = null;

            function showMessageModal(title, message) {
                modalTitle.textContent = title;
                modalMessage.textContent = message;
                messageModal.classList.remove('hidden');
            }

            closeModalBtn.addEventListener('click', () => {
                messageModal.classList.add('hidden');
            });

            languageSelect.addEventListener('change', () => {
                const language = languageSelect.value.toLowerCase();
                let mode;
                switch (language) {
                    case 'python': mode = 'python'; break;
                    case 'javascript': mode = 'javascript'; break;
                    case 'java': mode = 'java'; break;
                    case 'c++': mode = 'c_cpp'; break;
                    case 'go': mode = 'golang'; break;
                    case 'ruby': mode = 'ruby'; break;
                    case 'php': mode = 'php'; break;
                    case 'swift': mode = 'swift'; break;
                    case 'kotlin': mode = 'kotlin'; break;
                    case 'typescript': mode = 'typescript'; break;
                    case 'html': mode = 'html'; break;
                    default: mode = 'text'; break;
                }
                editor.getSession().setMode("ace/mode/" + mode);
            });

            const saveHistoryToFirestore = async (prompt, language, code) => {
                if (!userId) {
                    console.error("User not authenticated. Cannot save history.");
                    return;
                }
                try {
                    await addDoc(collection(window.db, `artifacts/${window.__app_id}/users/${userId}/code_history`), {
                        prompt: prompt,
                        language: language,
                        code: code,
                        timestamp: Date.now()
                    });
                } catch (e) {
                    console.error("Error adding document: ", e);
                    showMessageModal("Gagal Menyimpan", "Tidak dapat menyimpan riwayat kode Anda.");
                }
            };

            const deleteHistoryItem = async (docId) => {
                if (!userId) return;
                try {
                    await deleteDoc(doc(window.db, `artifacts/${window.__app_id}/users/${userId}/code_history`, docId));
                } catch (e) {
                    console.error("Error removing document: ", e);
                    showMessageModal("Gagal Menghapus", "Tidak dapat menghapus item riwayat.");
                }
            };

            clearHistoryBtn.addEventListener('click', async () => {
                if (!userId) {
                    showMessageModal("Peringatan", "Tidak ada riwayat untuk dihapus.");
                    return;
                }
                try {
                    const q = query(collection(window.db, `artifacts/${window.__app_id}/users/${userId}/code_history`));
                    const querySnapshot = await getDocs(q);
                    
                    for (const doc of querySnapshot.docs) {
                        await deleteDoc(doc.ref);
                    }
                    showMessageModal("Berhasil", "Riwayat telah dihapus.");
                } catch (e) {
                    console.error("Error deleting all history: ", e);
                    showMessageModal("Gagal", "Tidak dapat menghapus semua riwayat.");
                }
            });

            const displayHistory = (docs) => {
                historyList.innerHTML = '';
                if (docs.length > 0) {
                    historyContainer.classList.remove('hidden');
                    docs.forEach(doc => {
                        const item = doc.data();
                        const docId = doc.id;
                        const date = new Date(item.timestamp).toLocaleString();

                        const historyItem = document.createElement('div');
                        historyItem.classList.add('p-3', 'rounded-lg', 'bg-slate-700', 'hover:bg-slate-600', 'transition-colors', 'duration-300', 'dark:bg-slate-700', 'dark:hover:bg-slate-600', 'light:bg-gray-200', 'light:hover:bg-gray-300', 'light:text-gray-800', 'flex', 'flex-col', 'space-y-1');

                        const header = document.createElement('div');
                        header.classList.add('flex', 'justify-between', 'items-center');

                        const langAndDate = document.createElement('div');
                        langAndDate.classList.add('flex', 'items-center', 'space-x-2');
                        langAndDate.innerHTML = `<p class="font-bold text-blue-400 text-sm">${item.language}</p><p class="text-xs text-gray-500">${date}</p>`;
                        
                        const deleteBtn = document.createElement('button');
                        deleteBtn.classList.add('p-1', 'rounded-full', 'hover:bg-red-500', 'transition-colors', 'duration-300');
                        deleteBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 hover:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                                  </svg>`;
                        deleteBtn.addEventListener('click', (event) => {
                            event.stopPropagation();
                            deleteHistoryItem(docId);
                        });

                        header.appendChild(langAndDate);
                        header.appendChild(deleteBtn);

                        const promptText = document.createElement('p');
                        promptText.classList.add('text-sm', 'truncate', 'cursor-pointer', 'mt-1');
                        promptText.textContent = item.prompt;
                        promptText.addEventListener('click', () => {
                            promptInput.value = item.prompt;
                            languageSelect.value = item.language;
                            languageSelect.dispatchEvent(new Event('change'));
                            editor.setValue(item.code, -1);
                            resultsDiv.classList.remove('hidden');
                            previewContainer.classList.add('hidden');
                            showMessageModal("Berhasil Dimuat", "Kode dari riwayat telah dimuat ke editor.");
                        });

                        historyItem.appendChild(header);
                        historyItem.appendChild(promptText);
                        historyList.appendChild(historyItem);
                    });
                } else {
                    historyContainer.classList.add('hidden');
                }
            };

            const typeCode = (text, index = 0) => {
                if (index < text.length) {
                    editor.setValue(text.substring(0, index + 1), -1);
                    editor.renderer.scrollToLine(editor.session.getLength() - 1, true, true, null);
                    setTimeout(() => typeCode(text, index + 1), 5);
                } else {
                    actionButtons.forEach(btn => btn.disabled = false);
                    editor.setReadOnly(false);
                    showMessageModal("Selesai!", "Kode berhasil dihasilkan.");
                }
            };

            generateBtn.addEventListener('click', async () => {
                const promptText = promptInput.value.trim();
                const language = languageSelect.value;

                if (!promptText) {
                    showMessageModal("Peringatan", "Silakan masukkan deskripsi prompt.");
                    return;
                }

                resultsDiv.classList.add('hidden');
                previewContainer.classList.add('hidden');
                loading.classList.remove('hidden');
                editor.setValue('');
                editor.setReadOnly(true);
                generateBtn.disabled = true;
                actionButtons.forEach(btn => btn.disabled = true);

                // Scroll to results section smoothly
                resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });

                chatHistory.push({ role: "user", parts: [{ text: `Hasilkan kode ${language} untuk: ${promptText}. Pastikan untuk hanya menyertakan kode dan komentar, tanpa menggunakan blok kode Markdown atau backtick.` }] });

                const payload = { contents: chatHistory };
                const maxRetries = 5;
                let retryCount = 0;
                let delay = 1000;

                while (retryCount < maxRetries) {
                    try {
                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (!response.ok) {
                            if (response.status === 429) {
                                throw new Error('Rate limit exceeded. Retrying...');
                            }
                            throw new Error('Network response was not ok');
                        }

                        const result = await response.json();
                        let generatedText = result?.candidates?.[0]?.content?.parts?.[0]?.text;

                        if (generatedText) {
                            generatedText = generatedText.replace(/```[a-z]*\n|```/g, '').trim();
                            chatHistory = [{ role: "model", parts: [{ text: generatedText }] }]; // Reset chat history
                            resultsDiv.classList.remove('hidden');
                            typeCode(generatedText);
                            saveHistoryToFirestore(promptText, language, generatedText);
                        } else {
                            showMessageModal("Error", "Tidak ada kode yang dihasilkan. Mohon coba lagi.");
                        }
                        break;
                    } catch (error) {
                        console.error('Fetch error:', error);
                        if (error.message.includes('Rate limit exceeded') && retryCount < maxRetries - 1) {
                            await new Promise(res => setTimeout(res, delay));
                            delay *= 2;
                            retryCount++;
                        } else {
                            showMessageModal("Error", `Gagal menghasilkan kode: ${error.message}`);
                            break;
                        }
                    }
                }

                loading.classList.add('hidden');
                generateBtn.disabled = false;
            });

            runBtn.addEventListener('click', () => {
                const code = editor.getValue();
                const language = languageSelect.value;

                if (language === 'HTML') {
                    previewFrame.srcdoc = code;
                    previewContainer.classList.remove('hidden');
                    showMessageModal("Berhasil!", "Pratinjau HTML berhasil dimuat.");
                } else {
                    showMessageModal("Info", "Fungsi Jalankan hanya tersedia untuk kode HTML.");
                    previewContainer.classList.add('hidden');
                }
            });

            downloadBtn.addEventListener('click', () => {
                const code = editor.getValue();
                const language = languageSelect.value.toLowerCase();
                let fileExtension = '.txt';
                switch (language) {
                    case 'python': fileExtension = '.py'; break;
                    case 'javascript': fileExtension = '.js'; break;
                    case 'java': fileExtension = '.java'; break;
                    case 'c++': fileExtension = '.cpp'; break;
                    case 'go': fileExtension = '.go'; break;
                    case 'ruby': fileExtension = '.rb'; break;
                    case 'php': fileExtension = '.php'; break;
                    case 'swift': fileExtension = '.swift'; break;
                    case 'kotlin': fileExtension = '.kt'; break;
                    case 'typescript': fileExtension = '.ts'; break;
                    case 'html': fileExtension = '.html'; break;
                }
                const filename = `generated_code${fileExtension}`;
                const blob = new Blob([code], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showMessageModal("Berhasil!", "Kode berhasil diunduh.");
            });

            copyBtn.addEventListener('click', () => {
                const code = editor.getValue();
                // Fallback to execCommand because Clipboard API is blocked in this environment
                fallbackCopyTextToClipboard(code);
            });

            function fallbackCopyTextToClipboard(text) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.width = "2em";
                textArea.style.height = "2em";
                textArea.style.padding = "0";
                textArea.style.border = "none";
                textArea.style.outline = "none";
                textArea.style.boxShadow = "none";
                textArea.style.background = "transparent";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    const successful = document.execCommand('copy');
                    const msg = successful ? 'Berhasil disalin dengan fallback!' : 'Gagal menyalin dengan fallback.';
                    showMessageModal("Info", msg);
                } catch (err) {
                    console.error('Gagal menyalin:', err);
                    showMessageModal("Gagal", "Tidak dapat menyalin kode.");
                }
                document.body.removeChild(textArea);
            }

            // Initial auth state check and history load
            onAuthStateChanged(window.auth, (user) => {
                if (user) {
                    userId = user.uid;
                    userIdDisplay.textContent = userId;
                    const q = query(collection(window.db, `artifacts/${window.__app_id}/users/${userId}/code_history`), orderBy("timestamp", "desc"));
                    onSnapshot(q, (querySnapshot) => {
                        displayHistory(querySnapshot.docs);
                    });
                } else {
                    userId = null;
                    userIdDisplay.textContent = "Tidak terautentikasi";
                }
            });
        });
    </script>
</body>
</html>
