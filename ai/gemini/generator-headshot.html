<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Headshot Profesional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .container {
            max-width: 900px;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #3b82f6;
            animation: spin 1s ease infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="container bg-white p-8 rounded-2xl shadow-xl w-full">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-2">Generator Headshot Profesional</h1>
        <p class="text-center text-gray-500 mb-8">Ubah foto wajah Anda menjadi headshot profesional berkualitas tinggi.</p>

        <div class="flex flex-col md:flex-row gap-8">
            <!-- Area Input dan Kontrol -->
            <div class="flex-1 flex flex-col items-center justify-center p-6 bg-gray-50 rounded-xl border border-gray-200">
                <label for="imageUpload" class="cursor-pointer bg-blue-500 text-white font-medium py-3 px-6 rounded-full shadow-lg hover:bg-blue-600 transition-colors duration-200 mb-4">
                    Pilih Gambar Wajah
                </label>
                <input type="file" id="imageUpload" class="hidden" accept="image/*">
                <div id="imagePreview" class="w-full h-auto max-h-64 object-contain rounded-xl overflow-hidden bg-gray-200 flex items-center justify-center p-4">
                    <span class="text-gray-400 text-center">Pratinjau gambar Anda akan muncul di sini.</span>
                </div>
                
                <button id="generateBtn" class="mt-6 w-full bg-green-500 text-white font-medium py-3 px-6 rounded-full shadow-lg hover:bg-green-600 transition-colors duration-200 flex items-center justify-center">
                    <span id="btnText">Buat Headshot</span>
                    <div id="spinner" class="spinner hidden"></div>
                </button>
                <p id="statusMessage" class="mt-4 text-center text-sm text-gray-600"></p>
            </div>

            <!-- Area Hasil -->
            <div class="flex-1 flex flex-col items-center p-6 bg-gray-50 rounded-xl border border-gray-200">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Hasil Headshot</h2>
                <div class="w-full h-auto aspect-square bg-gray-200 rounded-xl overflow-hidden shadow-md flex items-center justify-center">
                    <img id="resultImage" class="w-full h-full object-contain" src="https://placehold.co/512x512/e5e7eb/7f8c8d?text=Hasil+di+sini" alt="Hasil Gambar">
                </div>
            </div>
        </div>
    </div>

    <script>
        // API key untuk Gemini API. Biarkan kosong, Canvas akan menyediakannya saat runtime.
        const defaultApiKey = "";
        const apiUrlBase = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=`;
        
        // Array untuk API key Anda. Tambahkan atau hapus key di sini.
        // API key dari Canvas akan digunakan terlebih dahulu.
        const hardcodedApiKeys = [
            "AIzaSyBpXQQx-P6t08ukOeGOWXNQpCJhCXklmlo",
            "AIzaSyCljyWdpQZKjrhLqCJg36jjT3yZD4UB1q0",
            // Tambahkan API key lain di sini
        ];

        // Dapatkan elemen-elemen DOM
        const imageUpload = document.getElementById('imageUpload');
        const imagePreview = document.getElementById('imagePreview');
        const generateBtn = document.getElementById('generateBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const resultImage = document.getElementById('resultImage');
        const statusMessage = document.getElementById('statusMessage');

        let uploadedBase64Image = null;
        let uploadedMimeType = null; // Tambahkan variabel untuk menyimpan mimeType

        // Mendengarkan saat file dipilih
        imageUpload.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                statusMessage.textContent = 'Gambar siap diunggah.';
                uploadedMimeType = file.type; // Dapatkan mimeType dari file
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        imagePreview.innerHTML = '';
                        imagePreview.appendChild(img);
                        img.style.width = '100%';
                        img.style.height = '100%';
                        img.style.objectFit = 'contain';
                    };
                    img.src = e.target.result;
                    // Ambil data Base64 setelah 'data:image/png;base64,'
                    uploadedBase64Image = e.target.result.split(',')[1];
                };
                reader.readAsDataURL(file);
            }
        });

        // Mendengarkan klik tombol "Buat Headshot"
        generateBtn.addEventListener('click', async () => {
            if (!uploadedBase64Image) {
                statusMessage.textContent = 'Harap pilih gambar terlebih dahulu.';
                return;
            }

            // Tampilkan indikator loading
            btnText.textContent = 'Memproses...';
            spinner.classList.remove('hidden');
            generateBtn.disabled = true;
            statusMessage.textContent = 'AI sedang membuat gambar Anda. Ini mungkin memakan waktu beberapa saat...';

            // Mendefinisikan prompt untuk AI yang lebih detail untuk hasil terbaik
            const promptText = "a professional, formal headshot of a person with a solid red background, studio lighting, soft fill light, sharp key light from the side, elegant rim lighting, highly detailed, masterpiece, photorealistic, 8K resolution, shot with a Canon EOS R6, clear focus on the face, flawless skin texture, sharp and clear eyes, elegant professional outfit, ultra-detailed";

            const payload = {
                contents: [{
                    parts: [
                        { text: promptText },
                        {
                            inlineData: {
                                // MimeType sekarang dinamis
                                mimeType: uploadedMimeType,
                                data: uploadedBase64Image
                            }
                        }
                    ]
                }],
                generationConfig: {
                    responseModalities: ['TEXT', 'IMAGE']
                }
            };

            const headers = {
                'Content-Type': 'application/json',
            };
            
            // Gabungkan default API key dengan key yang di hardcode
            const allKeys = [defaultApiKey, ...hardcodedApiKeys];
            
            let success = false;
            let lastError = null;

            for (const key of allKeys) {
                // Lewati key yang kosong
                if (!key) continue;

                const apiUrl = apiUrlBase + key;
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify(payload)
                    });

                    if (response.status === 429) {
                        // Jika 429, coba key berikutnya
                        continue;
                    }

                    if (!response.ok) {
                        throw new Error(`Error API: ${response.status} ${response.statusText}`);
                    }

                    const result = await response.json();
                    
                    // Ambil data gambar Base64 dari respons yang diformat berbeda
                    const base64Data = result?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData?.data;
                    if (base64Data) {
                        const imageUrl = `data:image/png;base64,${base64Data}`;
                        resultImage.src = imageUrl;
                        statusMessage.textContent = 'Gambar headshot berhasil dibuat!';
                        success = true;
                        break; // Keluar dari loop jika berhasil
                    } else {
                        throw new Error('Respons API tidak mengandung data gambar yang diharapkan.');
                    }

                } catch (error) {
                    console.error('Terjadi kesalahan:', error);
                    lastError = error;
                }
            }

            if (!success) {
                statusMessage.textContent = `Gagal membuat headshot. Terjadi kesalahan: ${lastError ? lastError.message : 'Tidak ada API key yang berfungsi.'}`;
                resultImage.src = 'https://placehold.co/512x512/e5e7eb/cc0000?text=Error';
            }
            
            // Sembunyikan indikator loading
            btnText.textContent = 'Buat Headshot';
            spinner.classList.add('hidden');
            generateBtn.disabled = false;
        });
    </script>
</body>
</html>
