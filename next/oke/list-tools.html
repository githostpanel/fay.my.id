<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kumpulan Tools — Fay Overlay</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0a0a0a; --card:#0f1115; --muted:#9ca3af; --accent:#7c3aed;
      --glass: rgba(255,255,255,0.03);
      --duration: 320ms;
      --easing: cubic-bezier(.2,.9,.2,1);
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:Inter,system-ui,Arial; background:var(--bg); color:#e6edf3;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      padding:24px; min-height:100vh;
    }

    header {
      max-width:1100px; margin:0 auto 24px; display:flex; gap:16px; align-items:center; justify-content:space-between;
    }
    .title {
      display:flex; flex-direction:column;
    }
    .title h1{ margin:0; font-size:20px; letter-spacing:-0.02em; }
    .title p{ margin:2px 0 0; color:var(--muted); font-size:13px; }

    /* search + filters */
    .controls {
      max-width:1100px; margin: 0 auto 18px; display:flex; gap:12px; align-items:center;
      flex-wrap:wrap;
    }
    .search {
      flex:1; min-width:220px;
      background:var(--glass); border:1px solid rgba(255,255,255,0.04); padding:8px 12px; border-radius:10px;
      display:flex; align-items:center; gap:8px;
    }
    .search input{
      background:transparent; border:0; outline:none; color:inherit; width:100%; font-size:14px;
    }
    .chips { display:flex; gap:8px; flex-wrap:wrap; }
    .chip {
      background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.04);
      padding:8px 10px; border-radius:999px; font-size:13px; color:var(--muted); cursor:pointer; user-select:none;
      transition: all var(--duration) var(--easing);
    }
    .chip.active { background: linear-gradient(90deg,var(--accent), #ec4899); color:white; transform:translateY(-2px); border: none; }

    /* grid */
    .grid-wrap { max-width:1100px; margin: 18px auto 80px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
    .card {
      background:var(--card); border-radius:12px; padding:14px; min-height:110px;
      display:flex; flex-direction:column; gap:10px; box-shadow: 0 6px 18px rgba(2,6,23,0.6);
      transition: transform .18s var(--easing), box-shadow .18s var(--easing);
      cursor:pointer; border:1px solid rgba(255,255,255,0.03);
    }
    .card:hover { transform: translateY(-6px); box-shadow: 0 18px 48px rgba(2,6,23,0.7); }
    .card h3{ margin:0; font-size:15px; }
    .card p{ margin:0; color:var(--muted); font-size:13px; line-height:1.25; }
    .tags { display:flex; gap:8px; flex-wrap:wrap; margin-top:auto; }
    .tag { font-size:12px; color:var(--muted); background:rgba(255,255,255,0.02); padding:6px 8px; border-radius:8px; }

    .card-actions { display:flex; gap:8px; }
    .btn { padding:8px 10px; border-radius:10px; font-size:13px; border:1px solid rgba(255,255,255,0.04); background:transparent; color:inherit; cursor:pointer; }
    .btn.primary { background: linear-gradient(90deg,var(--accent), #ec4899); color:white; border:none; }

    /* empty state */
    .empty { text-align:center; color:var(--muted); padding:28px 12px; }

    /* modal (reuse pattern yang sudah working) */
    .modal {
      position: fixed; inset:0; z-index:1200; display:flex; align-items:center; justify-content:center;
      background: rgba(0,0,0,0.78); backdrop-filter: blur(8px);
      opacity:0; visibility:hidden; pointer-events:none;
      transition: opacity var(--duration) var(--easing), visibility 0s linear var(--duration);
    }
    .modal.show { opacity:1; visibility:visible; pointer-events:auto; transition: opacity var(--duration) var(--easing); }
    .modal-content {
      width:96%; max-width:1100px; height:88vh; background:#0f1115; border-radius:12px; overflow:hidden;
      transform: translateY(6vh) scale(.985); opacity:0;
      transition: transform calc(var(--duration) * 1.05) var(--easing), opacity var(--duration) var(--easing);
      position:relative;
    }
    .modal.show .modal-content { transform: translateY(0) scale(1); opacity:1; }
    .modal iframe { width:100%; height:100%; border:0; display:block; background:white; }

    .close-btn {
      position:absolute; right:12px; top:12px; z-index:10;
      width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,0.45); border:1px solid rgba(255,255,255,0.04); color:#fff; cursor:pointer;
      transition: transform .18s var(--easing), background .18s;
    }
    .close-btn:hover { transform: rotate(80deg) scale(1.03); background: rgba(255,64,129,0.08); color:#ff9db3; }

    footer { max-width:1100px; margin: 20px auto; color:var(--muted); font-size:13px; text-align:center; }
    @media (max-width:640px){
      .modal-content { width:100%; height:100vh; border-radius:0; }
    }
  </style>
</head>
<body>

  <header>
    <div class="title">
      <h1>Kumpulan Tools</h1>
      <p>Filter & cari tools yang kamu butuhkan — klik untuk buka di modal.</p>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <a href="/" class="btn" style="text-decoration:none;color:inherit">Kembali</a>
    </div>
  </header>

  <div class="controls" role="region" aria-label="Kontrol pencarian dan filter">
    <div class="search" role="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="opacity:.7"><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <input id="searchInput" placeholder="Cari tools, mis. 'HTML' atau 'Image'..." aria-label="Cari tools">
    </div>

    <div class="chips" id="chips">
      <!-- chips di-generate lewat JS -->
    </div>
  </div>

  <main class="grid-wrap">
    <div id="grid" class="grid" role="list">
      <!-- cards will be injected -->
    </div>
    <div id="empty" class="empty" style="display:none">Tidak ada hasil. Coba kata kunci lain atau reset filter.</div>
  </main>

  <footer>Tools Blog — kumpulan utilitas untuk content creator / developer</footer>

  <!-- Modal -->
  <div id="iframeModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-content" role="document">
      <button class="close-btn" aria-label="Tutup (Esc)">✕</button>
      <iframe id="modalIframe" src="" title="Tool"></iframe>
    </div>
  </div>

  <script>
    /************* DATA TOOLS *************/
    // Tambah / edit entri di sini
    const toolsData = [
      {
        id: 'img-gen',
        title: 'Generate Post Image Blog Wallpaper',
        desc: 'Buat gambar sampul/post untuk blog secara cepat.',
        url: 'https://example.com/image-generator',
        tags: ['Image','Blog','Design']
      },
      {
        id: 'html-enc',
        title: 'HTML Encoder/Decoder',
        desc: 'Encode atau decode HTML entities.',
        url: 'https://example.com/html-encoder',
        tags: ['HTML','Encoder','Dev']
      },
      {
        id: 'base64',
        title: 'Base64 Encode/Decode',
        desc: 'Encoding dan decoding Base64 untuk teks/gambar.',
        url: 'https://example.com/base64',
        tags: ['Encoder','Dev','Text']
      },
      {
        id: 'lorem',
        title: 'Lorem Ipsum Generator',
        desc: 'Generate placeholder text untuk artikel atau layout.',
        url: 'https://example.com/lorem',
        tags: ['Text','Blog']
      }
      // tambahkan lebih banyak sesuai kebutuhan
    ];

    /************* UI & FILTERING *************/
    const grid = document.getElementById('grid');
    const chipsWrap = document.getElementById('chips');
    const searchInput = document.getElementById('searchInput');
    const emptyState = document.getElementById('empty');

    // kumpulkan semua tag unik
    const allTags = Array.from(new Set(toolsData.flatMap(t => t.tags))).sort();
    let activeTags = new Set();

    // render chips
    function renderChips(){
      chipsWrap.innerHTML = '';
      // tambah chip "Semua" (reset)
      const allChip = document.createElement('div');
      allChip.className = 'chip' + (activeTags.size===0 ? ' active' : '');
      allChip.textContent = 'Semua';
      allChip.addEventListener('click', () => { activeTags.clear(); renderChips(); renderGrid(); });
      chipsWrap.appendChild(allChip);

      allTags.forEach(tag=>{
        const c = document.createElement('div');
        c.className = 'chip' + (activeTags.has(tag) ? ' active' : '');
        c.textContent = tag;
        c.addEventListener('click', () => {
          if (activeTags.has(tag)) activeTags.delete(tag);
          else activeTags.add(tag);
          renderChips();
          renderGrid();
        });
        chipsWrap.appendChild(c);
      });
    }

    // render grid berdasarkan filter & search
    function renderGrid(){
      const q = searchInput.value.trim().toLowerCase();
      const active = Array.from(activeTags);
      const filtered = toolsData.filter(t => {
        // cek tag (jika ada active tag harus semua ada di t.tags -> OR? kita gunakan OR: match any active tag)
        const tagMatch = active.length === 0 ? true : t.tags.some(tag => active.includes(tag));
        // cek query: title atau desc atau tags
        const textMatch = q === '' ? true :
          (t.title + ' ' + t.desc + ' ' + t.tags.join(' ')).toLowerCase().includes(q);
        return tagMatch && textMatch;
      });

      grid.innerHTML = '';
      if (filtered.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
      }

      filtered.forEach(t => {
        const card = document.createElement('article');
        card.className = 'card';
        card.setAttribute('data-id', t.id);
        card.innerHTML = `
          <div>
            <h3>${t.title}</h3>
            <p>${t.desc}</p>
          </div>
          <div class="tags" aria-hidden="true">
            ${t.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
          </div>
          <div style="display:flex;gap:8px;margin-top:10px">
            <button class="btn primary open-btn" data-url="${t.url}">Buka</button>
            <a class="btn" href="${t.url}" target="_blank" rel="noopener">Buka di tab baru</a>
          </div>
        `;
        grid.appendChild(card);
      });

      // pasang handler buka modal untuk tombol yang baru dirender
      document.querySelectorAll('.open-btn').forEach(btn=>{
        btn.addEventListener('click', (ev) => {
          const url = btn.dataset.url;
          openModal(url);
        });
      });
    }

    // debounce simple untuk search
    function debounce(fn, ms=200){
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(()=>fn(...args), ms); };
    }
    searchInput.addEventListener('input', debounce(renderGrid, 180));

    // init UI
    renderChips();
    renderGrid();

    /************* MODAL (reuse working modal pattern) *************/
    const modal = document.getElementById('iframeModal');
    const modalIframe = document.getElementById('modalIframe');
    const closeBtn = modal.querySelector('.close-btn');
    let lastActive = null;

    function openModal(url){
      lastActive = document.activeElement;
      modalIframe.src = url;
      modal.classList.add('show');
      modal.setAttribute('aria-hidden','false');
      document.documentElement.style.overflow = 'hidden';
      document.body.style.overflow = 'hidden';
      closeBtn.focus();
    }

    function closeModal(){
      modal.classList.remove('show');
      modal.setAttribute('aria-hidden','true');
      // fokus balik
      if (lastActive && lastActive.focus) lastActive.focus();
    }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (ev)=> { if (ev.target === modal) closeModal(); });
    document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && modal.classList.contains('show')) closeModal(); });

    // bersihkan src setelah transisi selesai (agar tidak stuck saat buka lagi)
    modal.addEventListener('transitionend', (ev) => {
      if (ev.target === modal && ev.propertyName === 'opacity') {
        if (!modal.classList.contains('show')) {
          modalIframe.src = '';
          document.documentElement.style.overflow = '';
          document.body.style.overflow = '';
        }
      }
    });

    /************* OPTIONAL: simple analytics / share (placeholder) *************/
    // you can add event tracking when tools clicked, etc.
  </script>
</body>
</html>
