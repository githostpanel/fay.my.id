<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery Foto Interaktif</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
    margin: 0;
    padding: 0;
  }

  h1 {
    text-align: center;
    padding: 20px;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 10px;
    padding: 10px;
  }

  .gallery img {
    width: 100%;
    height: auto;
    border-radius: 8px;
    cursor: pointer;
    object-fit: cover;
    transition: transform 0.3s ease;
  }
  .gallery img:hover {
    transform: scale(1.05);
  }

  /* Modal */
  .modal {
    display: none;
    position: fixed;
    z-index: 999;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    backdrop-filter: blur(6px);
    justify-content: center;
    align-items: center;
  }

  .modal-content {
    position: relative;
    max-width: 90%;
    max-height: 80vh;
  }

  .modal img {
    width: 100%;
    max-height: 80vh;
    border-radius: 10px;
  }

  .close {
    position: absolute;
    top: 10px;
    right: 15px;
    font-size: 30px;
    color: white;
    cursor: pointer;
  }

  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 40px;
    color: white;
    background: rgba(0, 0, 0, 0.5);
    border-radius: 50%;
    width: 50px;
    height: 50px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }

  .nav-left {
    left: -70px; /* di luar modal */
  }
  .nav-right {
    right: -70px; /* di luar modal */
  }

  @media (max-width: 768px) {
    .nav-left {
      left: 10px;
    }
    .nav-right {
      right: 10px;
    }
  }

  /* Lazy load efek */
  .lazy {
    filter: blur(10px);
    transition: filter 0.5s ease;
  }
  .lazy.loaded {
    filter: blur(0);
  }
</style>
</head>
<body>

<h1>Gallery Foto Interaktif</h1>
<div class="gallery" id="gallery"></div>

<!-- Modal -->
<div class="modal" id="imgModal">
  <span class="close" id="closeModal">&times;</span>
  <div class="modal-content">
    <span class="nav-arrow nav-left" id="prevArrow">&#10094;</span>
    <img id="modalImage" src="" alt="Preview">
    <span class="nav-arrow nav-right" id="nextArrow">&#10095;</span>
  </div>
</div>

<script>
const galleryEl = document.getElementById("gallery");
const modal = document.getElementById("imgModal");
const modalImg = document.getElementById("modalImage");
const closeBtn = document.getElementById("closeModal");
const prevArrow = document.getElementById("prevArrow");
const nextArrow = document.getElementById("nextArrow");

let images = [];
let currentIndex = 0;
let loadedCount = 0;
const batchSize = 5; // tampilkan 5 gambar per batch

// generate URL gambar
for (let i = 1; i <= 20; i++) {
  images.push(`https://tools.fay.my.id/ai/generator/prompt/kodok?width=400&height=300&${i}`);
}

// render batch
function renderBatch() {
  const batch = images.slice(loadedCount, loadedCount + batchSize);
  batch.forEach((src, index) => {
    const img = document.createElement("img");
    img.dataset.src = src; // lazy load
    img.classList.add("lazy");
    img.alt = `Foto ${loadedCount + index + 1}`;
    img.addEventListener("click", () => openModal(loadedCount + index));
    galleryEl.appendChild(img);

    // lazy load observer
    observer.observe(img);
  });
  loadedCount += batchSize;
}

// Lazy load observer
const observer = new IntersectionObserver((entries, obs) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const img = entry.target;
      img.src = img.dataset.src;
      img.onload = () => img.classList.add("loaded");
      obs.unobserve(img);
    }
  });
});

// buka modal
function openModal(index) {
  currentIndex = index;
  modal.style.display = "flex";
  updateModal();
}

// update isi modal + arrow
function updateModal() {
  modalImg.src = images[currentIndex];
  prevArrow.style.display = currentIndex === 0 ? "none" : "flex";
  nextArrow.style.display = currentIndex === images.length - 1 ? "none" : "flex";
}

// navigasi
prevArrow.addEventListener("click", () => {
  if (currentIndex > 0) {
    currentIndex--;
    updateModal();
  }
});
nextArrow.addEventListener("click", () => {
  if (currentIndex < images.length - 1) {
    currentIndex++;
    updateModal();
  }
});

// tutup modal
closeBtn.onclick = () => modal.style.display = "none";
window.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };

// scroll listener untuk load batch berikutnya
window.addEventListener("scroll", () => {
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 200) {
    if (loadedCount < images.length) {
      renderBatch();
    }
  }
});

// render awal
renderBatch();
</script>
</body>
</html>
